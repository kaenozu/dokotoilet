name: Commit Firestore SDK dependency

on:
  push:
    branches: [feat/firestore-community-backend]
    paths:
      - .github/workflows/commit-firestore-sdk.yml

permissions:
  contents: write

jobs:
  commit-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/firestore-community-backend
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Capture branch head
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Generate package and lockfile together
        run: bun add --exact @google-cloud/firestore@9.0.1
      - name: Validate generated dependency state
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Refuse to overwrite concurrent branch updates
        run: |
          git fetch origin feat/firestore-community-backend
          remote_sha=$(git rev-parse origin/feat/firestore-community-backend)
          test "$remote_sha" = "${{ steps.head.outputs.sha }}" || {
            echo "Branch moved during dependency generation: start=${{ steps.head.outputs.sha }} remote=$remote_sha" >&2
            exit 1
          }
      - name: Commit package and lockfile atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git diff --cached --check
          git diff --cached --quiet && {
            echo "No dependency changes to commit"
            exit 0
          }
          git commit -m "build: add Firestore SDK dependency"
          git push origin HEAD:feat/firestore-community-backend
