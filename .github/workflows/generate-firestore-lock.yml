name: Generate Firestore lockfile

on:
  pull_request:
    branches: [main]

# Temporary non-writing workflow used to regenerate package metadata as a CI artifact.
jobs:
  generate:
    if: github.event.pull_request.head.ref == 'feat/firestore-community-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun add --exact @google-cloud/firestore
      - run: bun run lint && bun run test && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: firestore-sdk-lockfiles
          path: |
            package.json
            bun.lock
          if-no-files-found: error
