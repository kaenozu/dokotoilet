name: Verify Firestore emulator

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'feat/firestore-community-backend'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - run: bun add --exact @google-cloud/firestore
      - name: Prepare emulator smoke test
        shell: bash
        run: |
          cat > firebase.json <<'JSON'
          {
            "emulators": {
              "firestore": { "port": 8080 },
              "ui": { "enabled": false }
            }
          }
          JSON
          cat > firestore-emulator-smoke.ts <<'TS'
          import { Firestore } from '@google-cloud/firestore';
          import { FirestoreCommunityStore } from './server/firestoreCommunityStore';

          function facility() {
            return {
              id: 'toilet-user-emulator',
              name: 'Emulator Toilet',
              facilityType: '公衆トイレ',
              category: 'park',
              dataSource: 'community',
              lat: 35,
              lng: 139,
              address: 'test',
              cleanlinessGrade: 'B',
              cleanlinessScore: 3,
              equipmentGrade: 'B',
              equipmentScore: 3,
              subScores: { cleanliness: 3, odor: 3, supplies: 3, comfort: 3 },
              attributes: {
                hasWashlet: null,
                hasMultipurpose: null,
                hasBabyTable: null,
                hasNursingRoom: null,
                hasPowderRoom: null,
                hasOstomate: null,
                isFree: null,
                isOpen24h: null,
                hasSoap: null,
                hasAlcohol: null,
                hasPaperTowelOrDryer: null,
                toiletStyle: null,
              },
              openingHours: 'unknown',
              description: 'emulator',
              reviewCount: 0,
              reviews: [],
            } as const;
          }

          const review = {
            userName: 'tester',
            overallScore: 5,
            cleanlinessScore: 4,
            odorScore: 3,
            suppliesScore: 2,
            comment: 'emulator clean',
          };

          const projectId = 'demo-dokotoilet';
          const db1 = new Firestore({ projectId });
          const store1 = new FirestoreCommunityStore(db1 as any);
          const added = await store1.addToilet(facility() as any);
          if (!added.added) throw new Error('facility create failed');
          const firstReview = await store1.addReview('toilet-user-emulator', review, 'ip-a');
          if (firstReview.error || firstReview.toilet?.reviewCount !== 1) {
            throw new Error('community review transaction failed');
          }
          await db1.terminate();

          const db2 = new Firestore({ projectId });
          const store2 = new FirestoreCommunityStore(db2 as any);
          const persisted = await store2.getToilets();
          if (persisted.length !== 1 || persisted[0].reviewCount !== 1) {
            throw new Error('emulator persistence/restart contract failed');
          }

          await store2.registerExternalFacilities!([
            { id: 'osm-node-42', source: 'osm', origin: 'live-osm' },
          ]);
          const external = await store2.addReview(
            'osm-node-42',
            { ...review, comment: 'external clean' },
            'ip-b'
          );
          if (external.error || external.reviews?.length !== 1) {
            throw new Error('external review transaction failed');
          }
          const reviewId = external.reviews![0].id;
          const votes = await Promise.all([
            store2.voteHelpful(reviewId, 'same-ip'),
            store2.voteHelpful(reviewId, 'same-ip'),
          ]);
          if (votes.filter((v) => v.voted).length !== 1) {
            throw new Error('concurrent helpful vote guard failed');
          }
          const duplicate = await store2.addReview(
            'osm-node-42',
            { ...review, comment: 'external clean' },
            'ip-b'
          );
          if (duplicate.error !== 'duplicate') {
            throw new Error('duplicate review guard failed');
          }
          await db2.terminate();
          console.log('FIRESTORE_EMULATOR_ACCEPTANCE_PASS');
          TS
      - name: Run Firestore emulator acceptance
        run: bunx firebase-tools@latest emulators:exec --project demo-dokotoilet --only firestore "bun firestore-emulator-smoke.ts"
