name: Verify wired Firestore runtime

on:
  push:
    branches: [feat/firestore-community-backend]
    paths:
      - .github/workflows/verify-firestore-runtime.yml

permissions:
  contents: read

jobs:
  verify-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/firestore-community-backend
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and build
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run test
          bun run build
      - name: Configure Firestore emulator
        run: |
          cat > firebase.json <<'JSON'
          {
            "emulators": {
              "firestore": { "port": 8080 },
              "ui": { "enabled": false }
            }
          }
          JSON
      - name: Store-level emulator acceptance
        run: bunx firebase-tools@latest emulators:exec --project demo-dokotoilet --only firestore "bun scripts/firestore-emulator-acceptance.ts"
      - name: HTTP runtime restart acceptance
        shell: bash
        run: |
          cat > /tmp/runtime-smoke.sh <<'SH'
          set -euo pipefail
          facility_id='google-ChIJHXtAN-6NGGARLL6RIDLFPXo'
          payload='{"userName":"runtime-ci","overallScore":5,"cleanlinessScore":5,"odorScore":4,"suppliesScore":4,"comment":"firestore runtime restart smoke"}'

          start_server() {
            NODE_ENV=production \
            COMMUNITY_BACKEND=firestore \
            COMMUNITY_SALT=runtime-ci-salt \
            PORT=4173 \
            bun dist/server.cjs >/tmp/dokotoilet-runtime.log 2>&1 &
            server_pid=$!
            for _ in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then
                return 0
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat /tmp/dokotoilet-runtime.log >&2
                return 1
              fi
              sleep 0.25
            done
            cat /tmp/dokotoilet-runtime.log >&2
            return 1
          }

          stop_server() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap 'stop_server || true' EXIT

          start_server
          first_code=$(curl -sS -o /tmp/first.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "http://127.0.0.1:4173/api/community/toilets/$facility_id/reviews")
          test "$first_code" = "201" || { cat /tmp/first.json >&2; exit 1; }
          stop_server

          start_server
          second_code=$(curl -sS -o /tmp/second.json -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "http://127.0.0.1:4173/api/community/toilets/$facility_id/reviews")
          test "$second_code" = "409" || { cat /tmp/second.json >&2; exit 1; }
          curl -fsS http://127.0.0.1:4173/api/community/toilets | grep -F "$facility_id" >/dev/null
          stop_server
          trap - EXIT
          echo FIRESTORE_RUNTIME_HTTP_ACCEPTANCE_PASS
          SH
          chmod +x /tmp/runtime-smoke.sh
          bunx firebase-tools@latest emulators:exec --project demo-dokotoilet --only firestore "bash /tmp/runtime-smoke.sh"
